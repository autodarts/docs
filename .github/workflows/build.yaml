# Builds the site with Hugo and deploys it to the autodarts-diy-docs Cloudflare
# Pages project (gitops: terraform/cloudflare/pages.tf). main is production
# (autodarts.diy); any other branch gets a preview at
# <branch>.autodarts-diy-docs-29l.pages.dev.
name: Deploy docs

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.149.0"
          extended: true

      - name: Build docs
        run: hugo

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=autodarts-diy-docs --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }}

      - run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
