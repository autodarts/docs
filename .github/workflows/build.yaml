# Builds the site with Hugo and deploys the autodarts-diy-docs Worker
# (wrangler.jsonc). main is production (autodarts.diy); any other branch is
# uploaded as a preview version at <branch>-autodarts-diy-docs.autodarts.workers.dev.
name: Deploy docs

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.149.0"
          extended: true

      - name: Build docs
        run: hugo

      # Preview aliases must be lowercase letters, digits and hyphens.
      - id: alias
        run: echo "alias=$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-|-$//g' | cut -c1-30)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ github.ref_name == 'main' && 'deploy' || format('versions upload --preview-alias {0}', steps.alias.outputs.alias) }}

      - run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url || steps.deploy.outputs.preview-url }}" >> "$GITHUB_STEP_SUMMARY"
